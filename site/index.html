<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home · RRNC Quality Ratings Dashboard</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="hero" id="hero"><div class="wrap"></div></div>
<main class="wrap">
<div class="kpis" id="kpis"></div>

<section><h2>What would you like to know?</h2>
<div class="qgrid">
 <a class="qcard" href="locality.html"><b>How is my locality or school district doing?</b></a>
 <a class="qcard" href="over-time.html"><b>Is quality improving?</b></a>
 <a class="qcard" href="types.html"><b>How do centers, schools and home-based programs compare?</b></a>
 <a class="qcard" href="class.html"><b>What does classroom quality look like?</b></a>
 <a class="qcard" href="types.html#honor"><b>Who is on the Honor Roll?</b></a>
</div>
</section>
</main>
<script src="common.js"></script>
<script>
function draw() {
  const S = SUMMARY, cur = S.years['2025-26'], st = S.statewide['2025-26'], n = cur.n, curL = levelsFromBins(cur.bins), last = LEVELS.length - 1;
  const diff = Math.round(cur.avg - st.avg), honorTotal = S.honor['2025-26']._unique;
  if (scaleKey === 'three') {
    const meets = curL[1] + curL[2];
    $('#hero .wrap').innerHTML = `<h2>${meets} of ${n} sites (${(100 * meets / n).toFixed(1)}%) in Ready Region North Central met or exceeded expectations in the 2025-26 program year.</h2>
      <p>The Ready Region North Central (RRNC) average was <b>${Math.round(cur.avg)} points</b>, ${diff} above the statewide average of ${Math.round(st.avg)}.</p>`;
  } else {
    const top2 = curL[last] + curL[last - 1], big = curL.indexOf(Math.max(...curL));
    $('#hero .wrap').innerHTML = `<h2>${pc(top2, n)} of RRNC sites score 600 or higher</h2>
      <p>The Ready Region North Central (RRNC) average was <b>${Math.round(cur.avg)} points</b>, ${diff} above the statewide average of ${Math.round(st.avg)}. The largest group (${curL[big]} sites) is at the ${LEVELS[big].name} level.</p>`;
  }
  $('#kpis').innerHTML = kpis([
    [fmt(n), 'sites rated in 2025-26'],
    [`${Math.round(cur.avg)}`, `average total points (state ${Math.round(st.avg)})`],
    ...DESC.map(i => [fmt(curL[i]), `${LEVELS[i].name} (${pc(curL[i], n)})`, LEVELS[i].color]),
    [fmt(honorTotal), `sites on an Honor Roll (${pc(honorTotal, n)})`],
  ]);
}
init('summary', draw, {filters: false, summary: true});
</script></body></html>
