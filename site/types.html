<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Program types · RRNC Quality Ratings Dashboard</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script></head>
<body><main class="wrap">
<section><h2>How do program types compare?</h2></section>
<div class="answer" id="answer"></div>
<div class="grid">
 <div class="card"><h3>Average score by program type</h3><div id="c-avg" class="chart short"></div></div>
 <div class="card"><h3>Ratings by program type</h3><div class="tbl" id="t-levels"></div></div>
</div>
<section id="honor" style="margin-top:40px"><h2>Who is on the Honor Roll?</h2>
<div class="answer" id="answer2"></div>
<div class="card"><div id="c-honor" class="chart"></div></div></section>
</main>
<script src="common.js"></script>
<script>
const ORDER = ['Center', 'Family Day Home', 'Public School'];   // display order
function draw() {
  const S = SUMMARY, cur = S.years['2025-26'], st = S.statewide['2025-26'], n = cur.n, r = Math.round;
  const byAvg = [...TYPES].sort((a, b) => cur.byType[b].avg - cur.byType[a].avg);
  $('#answer').innerHTML = `Average score: ` + byAvg.map((t, i) => `${i ? TLABEL[t].toLowerCase() : TLABEL[t]} ${r(cur.byType[t].avg)}`).join(', ') + ` points.`;

  // dumbbell: RRNC (green) and Virginia (grey) for each type, numbers outside the circles
  const rows = [...byAvg].reverse();
  const conn = rows.map(t => ({type: 'scatter', mode: 'lines', x: [cur.byType[t].avg, st.byType[t].avg], y: [TLABEL[t], TLABEL[t]], line: {color: P.grey, width: 2, dash: 'dot'}, hoverinfo: 'skip', showlegend: false}));
  const dots = (name, color, get, pos) => ({name, type: 'scatter', mode: 'markers+text', x: rows.map(t => get(t)), y: rows.map(t => TLABEL[t]), text: rows.map(t => `<b>${r(get(t))}</b>`), textposition: pos,
    textfont: {color: P.ink, size: 16}, marker: {size: 26, color, line: {width: 2, color: '#fff'}}, hovertemplate: `%{y}: %{x:.0f}<extra>${name}</extra>`});
  plot('c-avg', [...conn, dots('RRNC', P.rrnc, t => cur.byType[t].avg, 'top center'), dots('Virginia', P.grey, t => st.byType[t].avg, 'bottom center')],
    {xaxis: {title: {text: 'Avg. Total VQB5 Score'}, range: [545, 655], showgrid: false}, yaxis: {automargin: true, range: [-0.6, rows.length - 0.4], tickfont: {size: 16}},
     legend: {orientation: 'h', y: 1.12}, margin: {t: 50, r: 30, b: 70, l: 190}});

  const B = S.bins.byType, tl = Object.fromEntries(TYPES.map(t => [t, levelsFromBins(B[t])]));
  $('#t-levels').innerHTML = table(['Program type', ...DESC.map(lvHead), {t: 'Avg.<br>points', cls: 'hl'}],
    [...byAvg.map(t => [TSHORT[t], ...DESC.map(i => np(tl[t][i], sum(tl[t]))), r(cur.byType[t].avg)]), ['All sites', ...DESC.map(i => np(levelsFromBins(cur.bins)[i], n)), r(cur.avg)]], 1);

  // honor roll: grouped bars with bold labels, one colour per list
  const hn = S.honor['2025-26'], names = {Excellence: 'Excellence', 'Top Improvement in Interactions': 'Improvement', 'Top Infant and Toddler Quality': 'Infant/Toddler'};
  const colors = {Improvement: P.greenL, 'Infant/Toddler': P.rrnc, Excellence: P.greenDD};
  const keys = ['Top Improvement in Interactions', 'Top Infant and Toddler Quality', 'Excellence'];
  $('#answer2').innerHTML = `${hn._unique} sites (${pc(hn._unique, n)}) are on at least one Honor Roll.`;
  plot('c-honor', keys.map(k => ({name: names[k], type: 'bar', x: ORDER.map(t => TLABEL[t]), y: ORDER.map(t => hn[k][t]),
    text: ORDER.map(t => k.includes('Infant') && t === 'Public School' ? '<b>N/A</b>' : `<b>${hn[k][t]}</b>`), textposition: 'outside', textfont: {size: 16, color: P.ink}, cliponaxis: false, marker: {color: colors[names[k]]},
    hovertemplate: `%{x}<br>${names[k]} Honor Roll: %{y} sites<extra></extra>`})),
    {barmode: 'group', bargap: 0.25, yaxis: {title: {text: 'Number of Honor Roll Sites'}}, legend: {orientation: 'h', y: -0.2}, margin: {t: 30, r: 20, b: 90, l: 70}});
}
init('types', draw, {filters: false, summary: true});
</script></body></html>
