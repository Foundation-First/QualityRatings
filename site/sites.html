<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VQB5 Quality Ratings – Site finder</title><link rel="stylesheet" href="style.css"></head>
<body><main class="wrap"><section><h2>Find a site</h2><p class="lead">Search for a specific program, or filter and sort the list. Click a column heading to sort, and download your filtered list as a CSV.</p></section><div class="card">
<div class="row"><span id="pg" class="note"></span><button id="prev">‹ Prev</button><button id="next">Next ›</button><button id="csv">Download filtered CSV</button></div>
<div class="tbl"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
</div></main>
<script src="common.js"></script>
<script>
const COLS = [['name', 'Site'], ['county', 'Locality'], ['type', 'Type'], ['rating', 'Rating'], ['tp', 'Total pts'], ['ip', 'Interaction pts'], ['cp', 'Curriculum pts'], ['rooms', 'Ages'], ['honor', 'Honor roll']];
const PAGE = 50; let page = 0, sortK = 'name', sortDir = 1;
const val = (s, k) => Array.isArray(s[k]) ? s[k].join('; ') : s[k];
$('#head').innerHTML = COLS.map(([k, l]) => `<th class="sortable" data-k="${k}">${l}</th>`).join('');
$('#head').onclick = e => { const k = e.target.dataset.k; if (!k) return; sortDir = sortK === k ? -sortDir : 1; sortK = k; page = 0; draw(); };
$('#prev').onclick = () => { page = Math.max(0, page - 1); draw(); };
$('#next').onclick = () => { page++; draw(); };
$('#csv').onclick = () => {
  const cols = [...COLS.map(c => c[0]), 'addr', 'web'];
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = [cols.join(','), ...FILTERED.map(s => cols.map(k => q(val(s, k))).join(','))].join('\n');
  const a = Object.assign(document.createElement('a'), {href: URL.createObjectURL(new Blob([csv], {type: 'text/csv'})), download: 'vqb5_filtered_sites.csv'});
  a.click();
};
function draw() {
  const rows = [...FILTERED].sort((a, b) => {
    const x = val(a, sortK), y = val(b, sortK);
    return (x == null) - (y == null) || (x > y ? 1 : x < y ? -1 : 0) * sortDir;
  });
  const last = Math.max(0, Math.ceil(rows.length / PAGE) - 1); page = Math.min(page, last);
  $('#pg').textContent = `Page ${page + 1} of ${last + 1}`;
  $('#prev').disabled = page === 0; $('#next').disabled = page >= last;
  $('#body').innerHTML = rows.slice(page * PAGE, (page + 1) * PAGE).map(s => {
    const cls = (s.rating || '').split(' ')[0];
    const nm = s.web ? `<a href="${/^https?:/.test(s.web) ? '' : 'https://'}${esc(s.web)}" target="_blank" rel="noopener">${esc(s.name)}</a>` : esc(s.name);
    return `<tr><td>${nm}<br><span class="note">${esc(s.addr)}</span></td><td>${esc(s.county)}</td><td>${esc(s.type)}</td>
      <td><span class="pill ${cls}">${esc(s.rating)}</span></td><td>${fmt(s.tp)}</td><td>${fmt(s.ip)}</td><td>${fmt(s.cp)}</td><td>${esc(s.rooms.join(', '))}</td><td>${esc(s.honor.join(', '))}</td></tr>`;
  }).join('') || '<tr><td colspan="9">No sites match these filters.</td></tr>';
}
init('sites', draw);
</script></body></html>
