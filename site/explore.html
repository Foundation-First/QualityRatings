<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Explore · RRNC Quality Ratings Dashboard</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script></head>
<body><main class="wrap xmain">
<section><h2>Explore the data</h2>
<p class="lead">Start with a question, or choose what to show and how to split it. You can switch between a chart and a table of the same numbers, and use “Narrow down” above to focus on one locality, site type or funding source.</p>
<div class="chips" id="chips" role="group" aria-label="Starter questions"></div>
<div class="card controls">
 <label>Show<select id="c-show"></select></label>
 <label>Split by<select id="c-by"></select></label>
 <label class="chk" id="w-va"><input type="checkbox" id="c-va"><span>Add Virginia for comparison</span></label>
 <div><span class="note" style="display:block;margin-bottom:3px;font-weight:700">View</span><div class="viewseg" id="c-view" role="group" aria-label="View"></div></div>
</div></section>
<div class="kpis" id="kpis"></div>
<div class="card"><h3 id="m-title"></h3><p id="m-sub"></p>
 <div id="c-main" class="chart" style="height:420px"></div>
 <div class="tbl" id="t-main" style="display:none"></div>
 <div class="insight" id="i-main"></div></div>
</main>
<script src="common.js"></script>
<script>
const YRS = ['2023-24', '2024-25', '2025-26'];
const HON = [['Excellence', 'Excellence Honor Roll'], ['Improvement', 'Improvement Honor Roll'], ['Infant/Toddler', 'Infant & Toddler Honor Roll']];
const HON_COLORS = [P.greenDD, P.rrnc, P.greenL];
const SHOW = [['level-count', 'Rating levels (number of sites)'], ['level-pct', 'Rating levels (share of sites)'], ['avg', 'Average total points'], ['curr', 'Sites using an approved curriculum'], ['honor', 'Honor Roll sites']];
const BY = [['all', 'Nothing (all selected sites together)'], ['type', 'Site type'], ['county', 'Locality'], ['ages', 'Age group served'], ['fund', 'Public funding source'], ['status', 'New or returning site'], ['year', 'Program year (sites participating since 2023-24)']];
const VIEWS = [['chart', 'Chart'], ['table', 'Table'], ['flow', 'Movement between years']];
const PRESETS = [
  {id: 'overall', label: 'How did RRNC sites do?', show: 'level-count', by: 'all', view: 'chart'},
  {id: 'type', label: 'Centers, schools and home-based', show: 'level-pct', by: 'type', view: 'chart', va: true},
  {id: 'county', label: 'By locality', show: 'avg', by: 'county', view: 'chart'},
  {id: 'trends', label: 'Change over time', show: 'level-pct', by: 'year', view: 'chart'},
  {id: 'flow', label: 'Movement between years', show: 'level-count', by: 'all', view: 'flow'},
  {id: 'funding', label: 'By funding source', show: 'level-pct', by: 'fund', view: 'chart'},
  {id: 'status', label: 'New vs. returning sites', show: 'level-pct', by: 'status', view: 'chart'},
  {id: 'honor', label: 'Honor Roll', show: 'honor', by: 'type', view: 'chart'},
];
const ex = {show: 'level-count', by: 'all', view: 'chart', va: false};
const lab = (arr, k) => arr.find(a => a[0] === k)[1];

// ---------- state in the address bar so any view can be shared
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  const p = PRESETS.find(x => x.id === h.get('preset'));
  if (p) Object.assign(ex, {show: p.show, by: p.by, view: p.view, va: !!p.va});
  else {
    if (SHOW.some(a => a[0] === h.get('show'))) ex.show = h.get('show');
    if (BY.some(a => a[0] === h.get('by'))) ex.by = h.get('by');
    if (VIEWS.some(a => a[0] === h.get('view'))) ex.view = h.get('view');
    if (h.has('va')) ex.va = h.get('va') === '1';
  }
}
function writeHash() { history.replaceState(null, '', '#' + new URLSearchParams({show: ex.show, by: ex.by, view: ex.view, va: ex.va ? '1' : '0'})); }

function buildControls() {
  $('#c-show').innerHTML = SHOW.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
  $('#c-by').innerHTML = BY.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
  $('#c-view').innerHTML = VIEWS.map(([v, l]) => `<button type="button" data-v="${v}">${l}</button>`).join('');
  $('#chips').innerHTML = PRESETS.map(p => `<button type="button" class="chip" data-p="${p.id}">${p.label}</button>`).join('');
  $('#c-show').onchange = e => { ex.show = e.target.value; draw(); };
  $('#c-by').onchange = e => { ex.by = e.target.value; draw(); };
  $('#c-va').onchange = e => { ex.va = e.target.checked; draw(); };
  $('#c-view').onclick = e => { const v = e.target.dataset.v; if (v) { ex.view = v; draw(); } };
  $('#chips').onclick = e => { const p = PRESETS.find(x => x.id === e.target.dataset.p); if (p) { Object.assign(ex, {show: p.show, by: p.by, view: p.view, va: !!p.va}); draw(); } };
}
function syncControls() {
  $('#c-show').value = ex.show; $('#c-by').value = ex.by; $('#c-va').checked = ex.va && vaOK();
  document.querySelectorAll('#c-view button').forEach(b => { const on = b.dataset.v === ex.view; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  document.querySelectorAll('#chips .chip').forEach(b => { const p = PRESETS.find(x => x.id === b.dataset.p); b.classList.toggle('on', p.show === ex.show && p.by === ex.by && p.view === ex.view && !!p.va === (ex.va && vaOK())); });
  const flow = ex.view === 'flow';
  ['c-show', 'c-by'].forEach(id => { $('#' + id).disabled = flow; $('#' + id).closest('label').classList.toggle('disabled', flow); });
  $('#c-va').disabled = flow || !vaOK(); $('#w-va').classList.toggle('disabled', flow || !vaOK());
  $('#w-va').title = vaOK() ? '' : 'Virginia comparison is available for rating shares, average points and curriculum use, split by nothing or by site type (average points also by year).';
}
function vaOK() { return !!(ex.show === 'level-pct' && ['all', 'type'].includes(ex.by) || ex.show === 'avg' && ['all', 'type', 'year'].includes(ex.by) || ex.show === 'curr' && ['all', 'type'].includes(ex.by)); }

// ---------- numbers behind every view
const statsOf = (label, list) => ({label, n: list.length, L: levelCounts(list), avg: mean(list.map(s => s.tp)), curr: list.length ? 100 * list.filter(s => s.cu).length / list.length : null, honor: HON.map(([k]) => list.filter(s => s.honor.includes(k)).length)});
const vaStats = (label, k) => { const b = BENCH.state[k]; return {label, n: b.n, L: levelsFromBins(b.bins), avg: b.tp, curr: b.cp, isVA: true}; };
const bucket = (list, keyFn) => { const m = new Map(); list.forEach(s => { const ks = [].concat(keyFn(s)); ks.forEach(k => { if (k) (m.get(k) || m.set(k, []).get(k)).push(s); }); }); return m; };

function buildGroups() {
  const F = FILTERED;
  if (!F.length) return [];
  if (ex.by === 'all') return [{...statsOf('All selected sites', F), vaKey: 'all'}];
  if (ex.by === 'type') return TYPES.map(t => ({...statsOf(TLABEL[t], F.filter(s => s.type === t)), vaKey: t})).filter(g => g.n);
  if (ex.by === 'status') return [['New sites (first year participating)', s => s.hist['2024-25']?.tp == null], ['Returning sites', s => s.hist['2024-25']?.tp != null]].map(([l, f]) => statsOf(l, F.filter(f))).filter(g => g.n);
  if (ex.by === 'year') {
    const c = F.filter(s => YRS.every(y => (y === '2025-26' ? s.tp : s.hist[y]?.tp) != null));
    return YRS.map(y => { const tps = c.map(s => y === '2025-26' ? s.tp : s.hist[y].tp), cps = c.map(s => y === '2025-26' ? s.cp : s.hist[y].cp);
      return {label: y, n: c.length, L: levelsFromBins(bandCounts(tps.map(tp => ({tp})))), avg: mean(tps), curr: mean(cps), honor: null, va: SUMMARY.statewide[y].avg, year: true}; });
  }
  const keyFn = {county: s => s.county, ages: s => s.ages, fund: s => s.fund}[ex.by];
  let gs = [...bucket(F, keyFn)].map(([k, l]) => statsOf(k, l)).sort((a, b) => b.n - a.n);
  if (ex.by === 'fund') gs = gs.slice(0, 10);
  return gs;
}
const withVA = gs => {
  if (!ex.va || !vaOK()) return gs;
  if (ex.show === 'level-pct') return gs.flatMap(g => [g, vaStats('Virginia ' + (g.vaKey === 'all' ? 'sites' : g.label.toLowerCase()), g.vaKey)]);
  gs.forEach(g => { if (g.vaKey && !g.va) g.va = vaStats('Virginia', g.vaKey)[ex.show === 'curr' ? 'curr' : 'avg']; });
  return gs;
};

// ---------- drawing
function draw() {
  writeHash(); syncControls();
  const F = FILTERED, gs0 = buildGroups(), flow = ex.view === 'flow';
  const L = levelCounts(F), tp = F.map(s => s.tp);
  $('#kpis').innerHTML = F.length ? kpis([[fmt(F.length), 'sites in selection'], [Math.round(mean(tp)), 'average total points'], ...DESC.map(i => [fmt(L[i]), `${LEVELS[i].name} (${pc(L[i], F.length)})`, LEVELS[i].color])]) : '';
  const m = $('#c-main'), t = $('#t-main');
  try { Plotly.purge(m); } catch (e) {}
  if (!F.length) { m.style.display = 'none'; t.style.display = 'none'; $('#m-title').textContent = 'No sites match these filters'; $('#m-sub').textContent = ''; $('#i-main').textContent = 'Try removing a filter under “Narrow down”.'; return; }

  if (flow) {
    $('#m-title').textContent = 'How sites moved between rating levels';
    $('#m-sub').textContent = 'Each bar is a rating level and each ribbon follows sites from one year to the next. This visual shows the sites that participated in VQB5 during the 2025-26 year; sites that started participating later start in the grey “Not yet rated” bar.';
    m.style.display = ''; t.style.display = 'none'; m.style.height = '440px';
    sankeyLevels('c-main', F); const mv = sankeyLevels.lastMoved;
    $('#i-main').innerHTML = `Between consecutive years, <b>${pc(mv.total - mv.changed, mv.total)}</b> of sites stayed at the same level and <b>${pc(mv.changed, mv.total)}</b> changed level. With so many sites at one level, the Exceeds Expectations and Needs Support ribbons are thin; their counts are in the labels.`;
    return;
  }
  if (ex.show === 'honor' && ex.by === 'year') {
    m.style.display = 'none'; t.style.display = 'none'; $('#m-title').textContent = 'Honor Roll by program year'; $('#m-sub').textContent = '';
    $('#i-main').textContent = 'Honor Roll designations are only available for 2025-26. Choose a different split.'; return;
  }
  const gs = withVA(gs0), rr = gs.filter(g => !g.isVA);
  $('#m-title').textContent = lab(SHOW, ex.show) + (ex.by === 'all' ? '' : ' by ' + lab(BY, ex.by).replace(/ \(.*\)/, '').toLowerCase());
  $('#m-sub').textContent = ex.by === 'year' ? `Sites that have participated in VQB5 since 2023-24 (${gs0[0].n} sites), so the same sites are followed each year.` : ex.by === 'fund' ? 'Top 10 funding sources. A site can receive more than one, so it can appear in several groups.' : ex.by === 'all' ? 'All sites that match your filters.' : 'Number of sites in each group is shown in parentheses.';
  const small = rr.filter(g => g.n < 5 && ex.by !== 'year').length;
  let msg = '';
  if (ex.view === 'table') { m.style.display = 'none'; t.style.display = ''; renderTable(gs); }
  else { t.style.display = 'none'; m.style.display = ''; renderChart(gs, rr); }
  msg = insight(gs0, F, L);
  if (small) msg += ` Pale marks are groups with fewer than 5 sites, too few to read as typical.`;
  $('#i-main').innerHTML = msg;
}

function renderChart(gs, rr) {
  const m = $('#c-main'); m.style.height = '420px';
  const lbl = g => `${g.label} (n=${g.n})`;
  if (ex.show === 'level-count' || ex.show === 'level-pct') {
    const pct = ex.show === 'level-pct', x = gs.map(lbl);
    plot('c-main', LEVELS.map((l, i) => ({name: l.name, type: 'bar', x, y: gs.map(g => pct ? (g.n ? 100 * g.L[i] / g.n : 0) : g.L[i]), customdata: gs.map(g => g.L[i]),
      marker: {color: l.color, pattern: {shape: gs.map(g => g.isVA ? '/' : ''), size: 6, solidity: 0.35}, line: {color: gs.map(g => g.isVA ? l.color : 'rgba(0,0,0,0)'), width: 1}},
      text: gs.map(g => { const p = g.n ? 100 * g.L[i] / g.n : 0; return pct ? (p >= 8 ? Math.round(p) + '%' : '') : (g.L[i] ? String(g.L[i]) : ''); }), textposition: pct ? 'inside' : 'outside', cliponaxis: false, insidetextfont: {color: l.text},
      hovertemplate: `%{x}<br>${l.name}: %{customdata} sites` + (pct ? ' (%{y:.0f}%)' : '') + '<extra></extra>'})),
      {barmode: pct ? 'stack' : 'group', yaxis: {title: pct ? '% of sites' : 'Sites', range: pct ? [0, 100] : undefined}, xaxis: {tickangle: gs.length > 4 ? -25 : 0}, legend: {orientation: 'h', y: -0.5}, margin: {t: 20, r: 10, b: gs.length > 4 ? 150 : 110, l: 55}});
    return;
  }
  if (ex.show === 'honor') {
    const x = rr.map(lbl);
    plot('c-main', HON.map(([k, name], j) => ({name, type: 'bar', x, y: rr.map(g => g.honor[j]), marker: {color: HON_COLORS[j]}, text: rr.map(g => g.honor[j] || ''), textposition: 'outside', cliponaxis: false, hovertemplate: `%{x}<br>${name}: %{y} sites<extra></extra>`})),
      {barmode: 'group', yaxis: {title: 'Sites on the Honor Roll'}, xaxis: {tickangle: rr.length > 4 ? -25 : 0}, legend: {orientation: 'h', y: -0.5}, margin: {t: 20, r: 10, b: 140, l: 55}});
    return;
  }
  const key = ex.show === 'avg' ? 'avg' : 'curr', unit = key === 'avg' ? '' : '%';
  if (ex.by === 'year') {   // time on the x-axis: a line, not dots
    const tr = [{name: 'RRNC (same sites each year)', type: 'scatter', mode: 'lines+markers+text', x: YRS, y: rr.map(g => g[key]), text: rr.map(g => Math.round(g[key]) + unit), textposition: 'top center', line: {color: P.rrnc, width: 3}, marker: {size: 9}, hovertemplate: '%{x}: %{y:.1f}' + unit + '<extra>RRNC</extra>'}];
    if (ex.va && key === 'avg') tr.push({name: 'Virginia (all sites)', type: 'scatter', mode: 'lines+markers+text', x: YRS, y: rr.map(g => g.va), text: rr.map(g => Math.round(g.va)), textposition: 'bottom center', line: {color: P.grey, width: 3}, marker: {size: 9}, hovertemplate: '%{x}: %{y:.1f}<extra>Virginia</extra>'});
    plot('c-main', tr, {yaxis: {title: key === 'avg' ? 'Average total points' : 'Share of sites (%)'}, legend: {orientation: 'h', y: -0.25}});
    return;
  }
  const rows = rr.filter(g => g[key] != null).sort((a, b) => a[key] - b[key]);
  const vals = [...rows.map(g => g[key]), ...rows.filter(g => g.va != null).map(g => g.va)], lo = Math.min(...vals), hi = Math.max(...vals);
  const tr = [{name: 'RRNC', type: 'scatter', mode: 'markers+text', x: rows.map(g => g[key]), y: rows.map(lbl), text: rows.map(g => Math.round(g[key]) + unit), textposition: 'middle right', cliponaxis: false,
    marker: {size: rows.map(g => g.n < 5 ? 9 : 13), color: P.rrnc, opacity: rows.map(g => g.n < 5 ? 0.45 : 1), line: {width: 1.5, color: '#fff'}}, hovertemplate: '%{y}<br>%{x:.1f}' + unit + '<extra>RRNC</extra>'}];
  if (ex.va) tr.push({name: 'Virginia', type: 'scatter', mode: 'markers', x: rows.map(g => g.va ?? null), y: rows.map(lbl), marker: {symbol: 'diamond', size: 12, color: P.grey, line: {width: 1.5, color: '#fff'}}, hovertemplate: '%{y}<br>Virginia: %{x:.1f}' + unit + '<extra></extra>'});
  plot('c-main', tr, {xaxis: {title: key === 'avg' ? 'Average total points' : 'Share of sites using an approved curriculum (%)', range: key === 'avg' ? [lo - 20, hi + 30] : [Math.max(0, lo - 15), 105]}, yaxis: {automargin: true}, showlegend: !!ex.va, legend: {orientation: 'h', y: -0.2}, margin: {t: 20, r: 40, b: 70, l: 210}});
  m.style.height = Math.max(300, rows.length * 34 + 130) + 'px'; Plotly.Plots.resize('c-main');
}

function renderTable(gs) {
  const honor = ex.show === 'honor', rr = gs;
  const head = ['Group', 'Sites', ...DESC.map(lvHead), 'Avg<br>points', 'Approved<br>curriculum', ...(honor ? HON.map(h => h[1].replace(/ (in|&)/, '<br>$1')) : [])];
  const rows = rr.map(g => [g.isVA ? `<i>${esc(g.label)}</i>` : esc(g.label), fmt(g.n), ...DESC.map(i => np(g.L[i], g.n)), g.avg == null ? '–' : Math.round(g.avg), g.curr == null ? '–' : Math.round(g.curr) + '%',
    ...(honor ? HON.map((_, j) => g.honor ? np(g.honor[j], g.n) : '–') : [])]);
  $('#t-main').innerHTML = table(head, rows);
}

function insight(gs, F, L) {
  const n = F.length, last = LEVELS.length - 1;
  const lines = [`Across the <b>${fmt(n)}</b> selected sites: ` + DESC.map(i => `${fmt(L[i])} ${LEVELS[i].name}`).join(', ') + `. Average ${Math.round(mean(F.map(s => s.tp)))} points.`];
  const big = gs.filter(g => g.n >= 5 && !g.isVA);
  if (ex.by === 'year') { lines.push(`Following the ${gs[0].n} sites that have participated since 2023-24, average points were ${gs.map(g => g.avg.toFixed(1)).join(' → ')}.`); }
  else if (big.length > 1 && ex.show === 'avg') { const s = [...big].sort((a, b) => a.avg - b.avg); lines.push(`Highest average: <b>${esc(s[s.length - 1].label)}</b> (${Math.round(s[s.length - 1].avg)}); lowest: <b>${esc(s[0].label)}</b> (${Math.round(s[0].avg)}). Gaps of a few points are usually within normal variation.`); }
  else if (big.length > 1 && ex.show === 'curr') { const s = [...big].sort((a, b) => a.curr - b.curr); lines.push(`Highest share using an approved curriculum: <b>${esc(s[s.length - 1].label)}</b> (${Math.round(s[s.length - 1].curr)}%); lowest: <b>${esc(s[0].label)}</b> (${Math.round(s[0].curr)}%).`); }
  else if (big.length > 1 && ex.show.startsWith('level')) { const s = [...big].sort((a, b) => b.L[last] / b.n - a.L[last] / a.n); if (s[0].L[last]) lines.push(`Largest share at ${LEVELS[last].name}: <b>${esc(s[0].label)}</b> (${pc(s[0].L[last], s[0].n)}).`); }
  else if (ex.show === 'honor') { const u = F.filter(s => s.honor.length).length; lines.push(`<b>${u}</b> of these sites (${pc(u, n)}) are on at least one Honor Roll list.`); }
  return lines.join(' ');
}

readHash(); buildControls();
init('explore', draw, {summary: true, bench: true});
window.addEventListener('hashchange', () => { readHash(); if (ALL) draw(); });
</script></body></html>
