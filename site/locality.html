<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My locality · RRNC Quality Ratings Dashboard</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script></head>
<body><main class="wrap">
<section><h2>How is my locality doing?</h2>
<div class="pick"><label for="place">Choose a locality or school district</label><select id="place"></select></div></section>
<div class="answer" id="answer"></div>
<div class="kpis" id="kpis"></div>
<div class="card"><h3>Ratings: your choice, RRNC and Virginia</h3><div id="c-share" class="chart short"></div></div>
<p class="small" id="note"></p>
<p class="small"><a href="compare.html">Look up a specific school or program</a></p>
</main>
<script src="common.js"></script>
<script>
const PS = 'Public School';
let place = '';
function readHash() { place = new URLSearchParams(location.hash.slice(1)).get('place') || ''; }
function buildSelect() {
  const loc = {}, dist = {};
  ALL.forEach(s => { loc[s.county] = (loc[s.county] || 0) + 1; if (s.type === PS) dist[s.county] = (dist[s.county] || 0) + 1; });
  const opt = (v, l) => `<option value="${esc(v)}">${esc(l)}</option>`;
  $('#place').innerHTML = opt('', 'Whole region (RRNC)') +
    '<optgroup label="Localities (all programs)">' + Object.keys(loc).sort().map(l => opt('loc:' + l, l)).join('') + '</optgroup>' +
    '<optgroup label="School districts (public schools only)">' + Object.keys(dist).sort().map(l => opt('dist:' + l, distName(l))).join('') + '</optgroup>';
  $('#place').onchange = e => { place = e.target.value; draw(); };
}
function draw() {
  if (!ALL || !BENCH || !SUMMARY) return;
  if (place && !ALL.some(s => s.county === place.slice(place.indexOf(':') + 1))) place = '';
  $('#place').value = place;
  history.replaceState(null, '', place ? '#place=' + encodeURIComponent(place).replace(/%3A/g, ':') : location.pathname + location.search);
  const kind = place.startsWith('dist:') ? 'dist' : place.startsWith('loc:') ? 'loc' : '', name = place.slice(place.indexOf(':') + 1);
  const list = kind === 'dist' ? ALL.filter(s => s.county === name && s.type === PS) : kind === 'loc' ? ALL.filter(s => s.county === name) : ALL;
  const label = kind === 'dist' ? distName(name) : kind === 'loc' ? name : 'RRNC';
  const n = list.length, L = levelCounts(list), avg = Math.round(mean(list.map(s => s.tp)));
  const rr = Math.round(SUMMARY.years['2025-26'].avg), va = Math.round(BENCH.state.all.tp), last = LEVELS.length - 1;
  const good = scaleKey === 'three' ? `met or exceeded expectations` : `scored 600 or higher`, nGood = scaleKey === 'three' ? L[1] + L[2] : L[last] + L[last - 1];
  const sites = kind === 'dist' ? 'public-school sites' : 'sites';
  $('#answer').innerHTML = kind ? `In <b>${esc(label)}</b>, ${nGood} of ${n} ${sites} ${good}. The average score was <b>${avg} points</b>, compared with ${rr} for RRNC and ${va} for Virginia.`
    : `In RRNC, ${nGood} of ${n} sites ${good}. The average score was <b>${avg} points</b>, compared with ${va} for Virginia.`;
  $('#kpis').innerHTML = kpis([[fmt(n), kind === 'dist' ? 'public-school sites' : 'sites'], [avg, 'average points'], ...DESC.map(i => [fmt(L[i]), LEVELS[i].name, LEVELS[i].color])]);
  const rows = [[label, L, n]];
  if (kind) rows.push(['RRNC', levelsFromBins(SUMMARY.years['2025-26'].bins), SUMMARY.years['2025-26'].n]);
  rows.push(['Virginia', levelsFromBins(BENCH.state.all.bins), BENCH.state.all.n]);
  plot('c-share', LEVELS.map((l, i) => ({name: l.name, type: 'bar', orientation: 'h', y: rows.map(r => `${r[0]} (${fmt(r[2])})`), x: rows.map(r => r[2] ? 100 * r[1][i] / r[2] : 0), customdata: rows.map(r => r[1][i]), marker: {color: l.color},
    text: rows.map(r => { const p = r[2] ? 100 * r[1][i] / r[2] : 0; return p >= 6 ? `<b>${Math.round(p)}%</b>` : ''; }), textposition: 'inside', insidetextfont: {color: l.text, size: 16}, hovertemplate: `%{y}<br>${l.name}: %{customdata} sites (%{x:.0f}%)<extra></extra>`})),
    {barmode: 'stack', xaxis: {title: '% of sites', range: [0, 100]}, yaxis: {autorange: 'reversed', automargin: true}, legend: {orientation: 'h', y: -0.4}, margin: {t: 10, r: 10, b: 110, l: 200}});
  $('#note').textContent = n < 5 ? `Based on ${n} ${n === 1 ? 'site' : 'sites'}.` : kind === 'dist' ? 'Counts only public-school sites that take part in VQB5 (pre-K and birth-to-five programs).' : '';
}
readHash();
init('locality', () => { if (!$('#place').options.length) buildSelect(); draw(); }, {filters: false, sites: true, bench: true, summary: true});
window.addEventListener('hashchange', () => { readHash(); draw(); });
</script></body></html>
