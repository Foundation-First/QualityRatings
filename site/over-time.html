<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Over time · RRNC Quality Ratings Dashboard</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script></head>
<body><main class="wrap">
<section><h2>Is quality improving?</h2>
<div class="viewseg" id="types" role="group" aria-label="Program type" style="margin-bottom:6px"></div></section>
<div class="answer" id="answer"></div>
<div class="card"><div id="c-line" class="chart"></div></div>
<div class="grid" style="margin-top:26px">
 <div class="card"><h3>Average score by years in VQB5</h3><div class="tbl wrap1" id="t-tenure"></div></div>
 <div class="card"><h3>Ratings each year</h3><div class="tbl" id="t-levels"></div></div>
</div>
</main>
<script src="common.js"></script>
<script>
const YRS = ['2023-24', '2024-25', '2025-26'];
const OPTS = [['', 'All programs'], ['Center', 'Centers'], ['Public School', 'Public schools'], ['Family Day Home', 'Home-based']];
let type = '';
const box = $('#types');
box.innerHTML = OPTS.map(([v, l]) => `<button type="button" data-t="${v}">${l}</button>`).join('');
box.onclick = e => { if (e.target.dataset.t === undefined) return; type = e.target.dataset.t; draw(); };

// label each point above the highest line and below the lowest so the numbers do not collide
function placeLabels(series) {
  series.forEach(s => { s.textposition = YRS.map((_, k) => {
    const v = series.map(x => x.y[k]), hi = Math.max(...v), lo = Math.min(...v), me = s.y[k];
    if (me === hi) return 'top center'; if (me === lo) return 'bottom center';
    return hi - me >= me - lo ? 'top center' : 'bottom center';
  }); });
}

function draw() {
  if (!SUMMARY) return;
  box.querySelectorAll('button').forEach(b => { const on = b.dataset.t === type; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  const key = type || 'all', Y = SUMMARY.years, r = Math.round;
  const yr = y => type ? Y[y].byType[type] : Y[y];
  const all = YRS.map(y => yr(y).avg), va = YRS.map(y => type ? SUMMARY.statewide[y].byType[type].avg : SUMMARY.statewide[y].avg);
  const SS = SUMMARY.sameSites[key], c = {length: SS.n}, same = YRS.map(y => SS.avg[y]);
  const subject = type ? TLABEL[type] : 'RRNC sites', who = {'': 'sites', Center: 'centers', 'Public School': 'public-school sites', 'Family Day Home': 'home-based programs'}[type];
  const T = SUMMARY.tenure[key];
  $('#answer').innerHTML = `${subject} averaged ${r(all[0])} points in 2023-24, ${r(all[1])} in 2024-25 and ${r(all[2])} in 2025-26. ` +
    (c.length ? `The ${c.length} ${who} that have participated since 2023-24 averaged ${r(same[0])}, ${r(same[1])} and ${r(same[2])}. ` : '') +
    (T.second.n ? `Sites that joined in 2024-25 averaged ${r(T.second.avgFirstYear)} in their first year and ${r(T.second.avg)} in their second (${T.second.n} ${T.second.n === 1 ? 'site' : 'sites'}).` : '');

  // labelled points: RRNC green, Virginia grey
  const line = (name, y, color, dash) => ({name, type: 'scatter', mode: 'lines+markers+text', x: YRS, y, text: y.map(v => `<b>${r(v)}</b>`), textfont: {size: 16, color: P.ink},
    line: {color, width: 4, dash}, marker: {size: 10, color}, hovertemplate: `%{x}: %{y:.0f}<extra>${name}</extra>`});
  const series = [line('RRNC, all sites that year', all, P.rrnc), line(`RRNC, participating since 2023-24 (${c.length} sites)`, same, P.greenDD, 'dot'), line('Virginia, all sites', va, P.grey, 'dash')];
  placeLabels(series);
  const vals = series.flatMap(s => s.y);
  plot('c-line', series, {yaxis: {title: {text: 'Avg. Total VQB5 Score'}, range: [Math.min(...vals) - 8, Math.max(...vals) + 8]}, legend: {orientation: 'h', y: -0.22}, margin: {t: 20, r: 40, b: 100, l: 70}, xaxis: {}});

  const lv = YRS.map(y => levelsFromBins(yr(y).bins));
  $('#t-levels').innerHTML = table(['Quality rating', ...YRS.map(y => y.slice(2))], [...DESC.map(i => [LEVELS[i].name, ...YRS.map((_, k) => np(lv[k][i], yr(YRS[k]).n))]), ['Sites', ...YRS.map(y => yr(y).n)]]);

  const rows = [['First year (new in 2025-26)', T.first], ['Second year (joined in 2024-25)', T.second], ['Third year (participating since 2023-24)', T.third]].filter(x => x[1].n);
  $('#t-tenure').innerHTML = table(['Years in VQB5', 'Sites', {t: 'Average score, 2025-26', cls: 'hl'}], rows.map(([l, d]) => [l, d.n, r(d.avg)]), 1);
}
init('time', draw, {filters: false, summary: true});
</script></body></html>
